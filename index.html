<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="index.css" type="text/css">
</head>

<body>
    <div class="controls">
        <button id="start">Start</button>
        <button id="step">Pas</button>
        <button id="clear">Clear Board</button>
        <button id="randomize">Randomize</button>

        <label for="select">Models: </label>
        <select id="select">
            <option value="">-- Choose models --</option>
            <option value="block">Block (static)</option>
            <option value="beehive">Beehive (static)</option>
            <option value="loaf">Loaf (static)</option>
            <option value="boat">Boat (static)</option>
            <option value="blinker">Blinker (oscillating)</option>
            <option value="toad">Toad (oscillating)</option>
            <option value="beacon">Beacon (oscillating)</option>
            <option value="glider">Glider (dynamic)</option>
            <option value="lwss">Lightweight spaceship (dynamic)</option>
        </select>

    </div>

    <canvas id="board"></canvas>

    <div class="info">
        Generation: <b id="generation">0</b></br>
        Cells alive: <b id="population">0</b>
    </div>
    <p>Speed: 1 second per generation</p>
    <script src="const.js"></script>
    <script src="index.js"></script>
</body>

</html>
